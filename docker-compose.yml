# tasks-ui docker-compose.yml

name: pmo-ui

services:
  tasks-ui:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
      args:
        VITE_TASKS_API_BASE_URL: ${VITE_TASKS_API_BASE_URL:-/api/tasks}
        VITE_ENTITIES_API_BASE_URL: ${VITE_ENTITIES_API_BASE_URL:-/api/entities}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: tasks-ui
    restart: unless-stopped
    networks:
      - pmo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pmo_network"
      - "traefik.http.routers.tasks-ui.rule=PathPrefix(`/tasks`)"
      - "traefik.http.routers.tasks-ui.entrypoints=web"
      - "traefik.http.routers.tasks-ui.priority=100"
      - "traefik.http.services.tasks-ui.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

networks:
  pmo_network:
    external: true

secrets:
  github_token:
    file: ./secrets/github_token.txt