#version: '3.8'

services:
  tasks-ui:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/tasks}
    container_name: ui_tasks
    networks:
      - pmo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pmo_frontend"
      - "traefik.http.routers.tasks.rule=PathPrefix(`/tasks`)"
      - "traefik.http.routers.tasks.priority=100"  # Higher than shell's priority
      - "traefik.http.routers.tasks.middlewares=tasks-stripprefix"
      - "traefik.http.middlewares.tasks-stripprefix.stripprefix.prefixes=/tasks"
      - "traefik.http.services.tasks.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

networks:
  pmo_network:
    external: true

secrets:
  github_token:
    file: ./secrets/github_token.txt