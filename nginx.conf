server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Module Federation remote entry - MUST return 404 if missing
    location = /remoteEntry.js {
        try_files $uri =404;
        add_header Content-Type application/javascript;
        add_header Access-Control-Allow-Origin *;
        expires 0;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Federation chunks and assets under /tasks/assets/ - MUST return 404 if missing
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # All other routes under /tasks/ serve index.html for standalone mode
    # Note: In production behind Traefik, the shell handles routing;
    # this is only for standalone debugging.
    location / {
        try_files $uri $uri/ /index.html;
        
        location = /index.html {
            expires 0;
            add_header Cache-Control "no-store, must-revalidate";
        }
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}