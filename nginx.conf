# tasks-ui nginx.conf

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss;

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Module Federation remote entry (handles both /remoteEntry.js and /tasks/remoteEntry.js)
    location ~* remoteEntry\.js$ {
        # Try requested URI directly, or fall back to /remoteEntry.js in root
        try_files $uri /remoteEntry.js =404;
        default_type application/javascript;
        add_header Content-Type application/javascript always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Federation chunks and static assets (handles /assets/* and /tasks/assets/*)
    location ~* (?:/tasks)?/assets/(.*)$ {
        try_files /assets/$1 $uri =404;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Return 404 for missing static JS/CSS instead of serving HTML
    location ~* \.(?:js|mjs|css|json)$ {
        try_files $uri =404;
        add_header Access-Control-Allow-Origin * always;
    }

    # Support prefixed path /tasks/ for standalone or direct browser requests
    location /tasks/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;

        location = /tasks/index.html {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate" always;
        }
    }

    # Standard SPA fallback for root navigation
    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, must-revalidate" always;
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}